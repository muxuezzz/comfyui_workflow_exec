[project]
name = "comfyui-workflow-exec"
version = "0.1.0"
description = "ComfyUI Workflow Execution Library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=0.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.28.0",
    "websocket-client>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_workflow_exec"]
